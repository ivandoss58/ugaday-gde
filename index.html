
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1838">
  <title>Угадай где — Вопросы и ответы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="startScreen" class="screen start-screen" aria-label="Стартовый экран">
      <picture class="start-cover">
        <img src="images/game-cover.jpg" alt="Обложка игры-викторины" fetchpriority="high">
      </picture>
      <div class="start-overlay"></div>
      <div class="start-content">
        <button id="playBtn" class="play-btn" type="button" aria-label="Играть">
          <img src="images/start-button.png" alt="Играть">
        </button>
      </div>
    </section>

    <section id="menuScreen" class="screen menu-screen hidden" aria-label="Выбор раздела">
      <div class="menu-header">
        <h1>Выбери карточку</h1>
        <p>Соедини название с правильным изображением</p>
      </div>
      <div class="sections" id="sections"></div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden" aria-label="Игра">
      <header class="topbar">
        <button class="close-btn" id="backBtn" type="button" aria-label="Вернуться к разделам">×</button>
        <div class="progress" aria-label="Прогресс">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="lives" aria-label="Жизни">
          <span>♥</span><b id="lives">3</b>
        </div>
      </header>

      <div class="game-header">
        <div class="eyebrow" id="pageLabel"></div>
        <h1 id="gameTitle">Найди пару</h1>
        <p id="gameSubtitle"></p>
      </div>

      <section class="game-board">
        <div class="column" id="namesColumn"></div>
        <div class="column" id="picturesColumn"></div>
      </section>

      <button class="next-btn" id="nextBtn" type="button" disabled>Далее</button>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section id="resultsScreen" class="screen results-screen hidden" aria-label="Результаты карточки">
      <div class="results-panel">
        <div class="results-trophy" aria-hidden="true">🏆</div>
        <p class="results-eyebrow" id="resultsEyebrow">ОТЛИЧНАЯ РАБОТА!</p>
        <h1 id="resultsTitle">Карточка пройдена!</h1>
        <p class="results-message" id="resultsMessage">Вы нашли все пары!</p>

        <div class="results-stats">
          <div class="stat-card">
            <span class="stat-icon error-icon" aria-hidden="true">×</span>
            <strong id="resultErrors">0</strong>
            <span>Ошибок</span>
          </div>
        </div>

        <button id="resultsNextBtn" class="results-next-btn" type="button">Повторить</button>
        <button id="resultsMenuBtn" class="results-menu-btn" type="button">В меню</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
