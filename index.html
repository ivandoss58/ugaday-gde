<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Угадай где — Найди пару</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="close-btn" aria-label="Закрыть">×</button>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="lives" aria-label="Жизни"><span>♥</span><b id="lives">3</b></div>
    </header>

    <section class="intro">
      <h1>Найди пару</h1>
      <p>Соедини название города с его изображением.</p>
    </section>

    <section class="game-board" id="gameBoard" aria-label="Игровое поле">
      <div class="column names" id="namesColumn"></div>
      <div class="column pictures" id="picturesColumn"></div>
    </section>

    <button class="next-btn" id="nextBtn" disabled>Далее</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
